name: AuraForge
version: '${version}'
main: com.r0ine.auraforge.AuraForgePlugin
api-version: '1.21'
folia-supported: true
author: r0ine
description: Dövme tezgahı + büyü masası; süzülen malzemeler, zamanlamalı dövme, element kombinasyonlu büyü parşömenleri ve block display animasyonları.

commands:
  auraforge:
    description: AuraForge komutları
    aliases: [af]
    permission: auraforge.use

permissions:
  auraforge.use:
    default: true
  auraforge.place:
    default: true
  auraforge.altar:
    default: true
  auraforge.cast:
    default: true
  auraforge.give:
    default: op
  auraforge.reload:
    default: op
  auraforge.admin:
    description: Başkalarının tezgah ve masalarını yönetme, sınırları aşma
    default: op
