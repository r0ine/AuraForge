# AuraForge ayarları. /auraforge reload ile uygulanır.
# (forge.core-recipe ve arcane.core-recipe değişince yeniden başlatma ister.)

forge:
  core-item: NETHER_STAR
  core-recipe: true
  block: SMITHING_TABLE
  max-items: 6
  max-per-player: 3
  hologram-height: 2.1
  animation-interval: 2
  view-distance: 32.0

arcane:
  core-item: ECHO_SHARD
  core-recipe: true
  block: ENCHANTING_TABLE
  max-per-player: 2
  hologram-height: 2.2
  animation-interval: 2

crafting:
  rounds: 3
  sweep-ms: 1600
  speed-up: 0.8
  zone-width: 0.2
  perfect-width: 0.06
  bar-length: 32
  pause-ticks: 14

quality:
  power-min: 0.8
  power-max: 1.35
  cooldown-reduction: 0.3

abilities:
  dash:
    cooldown: 3.0
    power: 1.5
  leap:
    cooldown: 7.0
    power: 1.1
  shockwave:
    cooldown: 10.0
    radius: 4.5
    damage: 5.0
  guard:
    cooldown: 16.0
    duration: 100
    amplifier: 1
  wave:
    cooldown: 12.0
    radius: 5.5
    damage: 4.0

set-bonus:
  min-pieces: 2
  per-piece: 0.06

autosave-seconds: 30

recipes:
  ruzgar-kilici:
    ability: dash
    result: IRON_SWORD
    name: "<gradient:#9BE7FF:#3A8DFF>Rüzgâr Kılıcı</gradient>"
    description: "<gray>Sahibini rüzgârla ileri savurur."
    ingredients:
      FEATHER: 3
      IRON_INGOT: 2
      STICK: 1
  firtina-tozlugu:
    ability: dash
    result: IRON_LEGGINGS
    name: "<gradient:#9BE7FF:#3A8DFF>Fırtına Tozluğu</gradient>"
    ingredients:
      FEATHER: 2
      IRON_INGOT: 3
      SUGAR: 1
  sicrayan-cizme:
    ability: leap
    result: IRON_BOOTS
    name: "<gradient:#B6FF8A:#2FBF71>Sıçrayan Çizme</gradient>"
    description: "<gray>Düşüşün acısını rüzgâra bırakır."
    ingredients:
      SLIME_BALL: 2
      IRON_INGOT: 2
      RABBIT_FOOT: 1
  gok-cekici:
    ability: leap
    result: MACE
    name: "<gradient:#B6FF8A:#2FBF71>Gök Çekici</gradient>"
    ingredients:
      BREEZE_ROD: 2
      IRON_BLOCK: 1
      STICK: 1
  deprem-baltasi:
    ability: shockwave
    result: DIAMOND_AXE
    name: "<gradient:#FFB347:#FF5E62>Deprem Baltası</gradient>"
    description: "<gray>Yere vurduğunda çevresini savurur."
    ingredients:
      DIAMOND: 2
      TNT: 1
      GUNPOWDER: 2
      STICK: 1
  sarsinti-migferi:
    ability: shockwave
    result: DIAMOND_HELMET
    name: "<gradient:#FFB347:#FF5E62>Sarsıntı Miğferi</gradient>"
    ingredients:
      DIAMOND: 3
      TNT: 1
      OBSIDIAN: 1
  kale-gogusluk:
    ability: guard
    result: IRON_CHESTPLATE
    name: "<gradient:#E0C3FC:#8EC5FC>Kale Göğüslüğü</gradient>"
    ingredients:
      IRON_INGOT: 4
      OBSIDIAN: 1
      AMETHYST_SHARD: 1
  kale-migferi:
    ability: guard
    result: IRON_HELMET
    name: "<gradient:#E0C3FC:#8EC5FC>Kale Miğferi</gradient>"
    ingredients:
      IRON_INGOT: 3
      OBSIDIAN: 1
      AMETHYST_SHARD: 1
  bekci-kalkani:
    ability: guard
    result: SHIELD
    name: "<gradient:#E0C3FC:#8EC5FC>Bekçi Kalkanı</gradient>"
    ingredients:
      IRON_INGOT: 1
      OAK_PLANKS: 3
      OBSIDIAN: 1
      AMETHYST_SHARD: 1
  firtina-kilici:
    ability: wave
    result: NETHERITE_SWORD
    name: "<gradient:#A8E6CF:#4FC3F7>Fırtına Kılıcı</gradient>"
    description: "<gray>Etraftaki düşmanları savurur."
    ingredients:
      NETHERITE_INGOT: 1
      BREEZE_ROD: 2
      PHANTOM_MEMBRANE: 1
      FEATHER: 2

# Büyü kombinasyonları. İki element birleştirilince masada bir parşömen ortaya çıkar.
# "elements" iki elementten oluşur; aynı elementi iki kez yazmak da geçerli.
# Geçerli element anahtarları: fire, wind, ice, thunder, earth
# Geçerli efektler: fire_tornado, gale_wave, plasma_lance, magma_pillar, glacier_wall,
#                   thunderclap, blizzard, inferno, storm_surge, stone_fist, steam_burst, dust_devil
spells:
  atesli-kasirga:
    elements: [fire, wind]
    effect: fire_tornado
    name: "<gradient:#FF5E62:#A8E6CF>Ateşli Kasırga</gradient>"
    description: "<gray>Önünde dönen bir alev sütunu yürütür, düşmanları içine çeker."
    cooldown: 18.0
    power: 2.5
    radius: 4.0
    range: 8.0
    duration: 70
    result: FIRE_CHARGE
  dalgalar-ruzgari:
    elements: [wind, wind]
    effect: gale_wave
    name: "<gradient:#A8E6CF:#8EC5FC>Dalgalar Rüzgârı</gradient>"
    description: "<gray>Etrafındaki düşmanları ışık halkasıyla uçurur."
    cooldown: 10.0
    power: 2.0
    radius: 6.0
    range: 0.0
    duration: 20
    result: PAPER
  plazma-mizragi:
    elements: [fire, thunder]
    effect: plasma_lance
    name: "<gradient:#FF5E62:#FFF176>Plazma Mızrağı</gradient>"
    description: "<gray>Baktığın yöne bir elektrik-alev huzmesi atar."
    cooldown: 12.0
    power: 3.5
    radius: 1.5
    range: 14.0
    duration: 24
    result: END_ROD
  magma-sutunu:
    elements: [fire, earth]
    effect: magma_pillar
    name: "<gradient:#FFB347:#FF5E62>Magma Sütunu</gradient>"
    description: "<gray>Hedef noktada yerden alev sütunu çıkarır."
    cooldown: 16.0
    power: 2.5
    radius: 3.0
    range: 16.0
    duration: 40
    result: MAGMA_CREAM
  buzul-duvari:
    elements: [ice, earth]
    effect: glacier_wall
    name: "<gradient:#9AD5FF:#C38B5A>Buzul Duvarı</gradient>"
    description: "<gray>Önüne buz duvarı diker, dokunanı dondurur."
    cooldown: 14.0
    power: 2.0
    radius: 5.0
    range: 4.0
    duration: 80
    result: BLUE_ICE
  gok-gurultusu:
    elements: [wind, thunder]
    effect: thunderclap
    name: "<gradient:#FFF176:#A8E6CF>Gök Gürültüsü</gradient>"
    description: "<gray>Baktığın noktaya ışınlanır ve çevreyi savurur."
    cooldown: 18.0
    power: 2.5
    radius: 4.5
    range: 18.0
    duration: 20
    result: LIGHTNING_ROD
  kar-firtinasi:
    elements: [wind, ice]
    effect: blizzard
    name: "<gradient:#A8E6CF:#9AD5FF>Kar Fırtınası</gradient>"
    description: "<gray>Önüne kar konisi püskürtür, dondurur."
    cooldown: 10.0
    power: 1.4
    radius: 4.0
    range: 9.0
    duration: 60
    result: SNOWBALL
  cehennem-alani:
    elements: [fire, fire]
    effect: inferno
    name: "<gradient:#FF5E62:#FFB347>Cehennem Alanı</gradient>"
    description: "<gray>Çevresinde yanan bir alan açar."
    cooldown: 14.0
    power: 2.0
    radius: 4.5
    range: 0.0
    duration: 80
    result: FIRE_CHARGE
  firtina-zinciri:
    elements: [thunder, thunder]
    effect: storm_surge
    name: "<gradient:#FFF176:#FFB347>Fırtına Zinciri</gradient>"
    description: "<gray>En yakın düşmana sıçrayan yıldırım yollar."
    cooldown: 15.0
    power: 3.0
    radius: 7.0
    range: 20.0
    duration: 20
    result: COPPER_INGOT
  tas-yumruk:
    elements: [earth, earth]
    effect: stone_fist
    name: "<gradient:#C38B5A:#8E6E4E>Taş Yumruk</gradient>"
    description: "<gray>Dönen taş topu fırlatır."
    cooldown: 8.0
    power: 2.5
    radius: 2.0
    range: 16.0
    duration: 30
    result: COBBLESTONE
  buhar-patlamasi:
    elements: [fire, ice]
    effect: steam_burst
    name: "<gradient:#FF5E62:#9AD5FF>Buhar Patlaması</gradient>"
    description: "<gray>Etraftaki düşmanları buharla savurur."
    cooldown: 11.0
    power: 2.0
    radius: 4.0
    range: 0.0
    duration: 20
    result: GLASS_BOTTLE
  toz-sarmali:
    elements: [wind, earth]
    effect: dust_devil
    name: "<gradient:#C38B5A:#A8E6CF>Toz Sarmalı</gradient>"
    description: "<gray>Hedef noktada düşmanları kendine çeken küçük bir hortum oluşturur."
    cooldown: 13.0
    power: 1.5
    radius: 4.0
    range: 12.0
    duration: 60
    result: BROWN_CONCRETE_POWDER

