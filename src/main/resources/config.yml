    name: "<gradient:#B6FF8A:#2FBF71>Sıçrayan Çizme</gradient>"
    description: "<gray>Düşüşün acısını rüzgâra bırakır."
    ingredients:
      SLIME_BALL: 2
      IRON_INGOT: 2
      RABBIT_FOOT: 1
  gok-cekici:
    ability: leap
    result: MACE
    name: "<gradient:#B6FF8A:#2FBF71>Gök Çekici</gradient>"
    ingredients:
      BREEZE_ROD: 2
      IRON_BLOCK: 1
      STICK: 1
  deprem-baltasi:
    ability: shockwave
    result: DIAMOND_AXE
    name: "<gradient:#FFB347:#FF5E62>Deprem Baltası</gradient>"
    description: "<gray>Yere vurduğunda çevresini savurur."
    ingredients:
      DIAMOND: 2
      TNT: 1
      GUNPOWDER: 2
      STICK: 1
  sarsinti-migferi:
    ability: shockwave
    result: DIAMOND_HELMET
    name: "<gradient:#FFB347:#FF5E62>Sarsıntı Miğferi</gradient>"
    ingredients:
      DIAMOND: 3
      TNT: 1
      OBSIDIAN: 1
  kale-gogusluk:
    ability: guard
    result: IRON_CHESTPLATE
    name: "<gradient:#E0C3FC:#8EC5FC>Kale Göğüslüğü</gradient>"
    ingredients:
      IRON_INGOT: 4
      OBSIDIAN: 1
      AMETHYST_SHARD: 1
  kale-migferi:
    ability: guard
    result: IRON_HELMET
    name: "<gradient:#E0C3FC:#8EC5FC>Kale Miğferi</gradient>"
    ingredients:
      IRON_INGOT: 3
      OBSIDIAN: 1
      AMETHYST_SHARD: 1
  bekci-kalkani:
    ability: guard
    result: SHIELD
    name: "<gradient:#E0C3FC:#8EC5FC>Bekçi Kalkanı</gradient>"
    ingredients:
      IRON_INGOT: 1
      OAK_PLANKS: 3
      OBSIDIAN: 1
      AMETHYST_SHARD: 1

