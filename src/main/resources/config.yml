# AuraForge ayarları. /auraforge reload ile uygulanır.
# (forge.core-recipe ve arcane.core-recipe değişince yeniden başlatma ister.)

forge:
  core-item: NETHER_STAR
  core-recipe: true
  block: SMITHING_TABLE
  max-items: 6
  max-per-player: 3
  hologram-height: 2.1
  animation-interval: 2
  view-distance: 32.0

arcane:
  core-item: ECHO_SHARD
  core-recipe: true
  block: ENCHANTING_TABLE
  max-per-player: 2
  hologram-height: 2.2
  animation-interval: 2

crafting:
  rounds: 3
  sweep-ms: 1600
  speed-up: 0.8
  zone-width: 0.2
  perfect-width: 0.06
  bar-length: 32
  pause-ticks: 14

quality:
  power-min: 0.8
  power-max: 1.35
  cooldown-reduction: 0.3

abilities:
  dash:
    cooldown: 3.0
    power: 1.5
  leap:
    cooldown: 7.0
    power: 1.1
  shockwave:
    cooldown: 10.0
    radius: 4.5
    damage: 5.0
  guard:
    cooldown: 16.0
    duration: 100
    amplifier: 1
  wave:
    cooldown: 12.0
    radius: 5.5
    damage: 4.0

set-bonus:
  min-pieces: 2
  per-piece: 0.06

# Silah gelişimi: dövülmüş silahlar vuruş ve öldürmeyle tecrübe kazanır, her seviye bir ustalık puanı verir.
progression:
  max-level: 30
  # Bir sonraki seviye için gereken XP: xp-base + xp-step * (seviye - 1)
  xp-base: 60
  xp-step: 35
  xp-per-hit: 2
  # Öldürülen canlının can değeri bu sayıyla çarpılıp XP olarak eklenir
  xp-per-health: 1.0
  # Takılı element rune'unun vuruşta tetiklenme şansı (Rezonans bunun üstüne eklenir)
  element-chance: 0.12
  # Ustalık ağacını sıfırlamanın bedeli (oyuncu XP seviyesi)
  reset-levels: 10

# Arıtma: büyü masasındaki "+ Gelişim" menüsünden eşyayı +1 ... +10 yükseltme.
enhance:
  max-plus: 10
  # Her basamağın başarı şansı (yüzde): +0→+1, +1→+2 ...
  chances: [100, 95, 90, 80, 70, 60, 50, 40, 30, 20]
  # Bu basamaktan itibaren başarısız deneme eşyayı bir düşürür
  downgrade-from: 6
  # Bu seviyeye ulaşan arıtma tüm sunucuya duyurulur
  broadcast-from: 8
  damage-per-plus: 0.03
  power-per-plus: 0.02
  armor-per-plus: 0.01
  costs:
    - { IRON_INGOT: 4 }
    - { IRON_INGOT: 6 }
    - { IRON_INGOT: 8, LAPIS_LAZULI: 4 }
    - { GOLD_INGOT: 6, LAPIS_LAZULI: 8 }
    - { DIAMOND: 2, AMETHYST_SHARD: 4 }
    - { DIAMOND: 3, AMETHYST_SHARD: 8 }
    - { DIAMOND: 4, ECHO_SHARD: 1 }
    - { NETHERITE_SCRAP: 1, DIAMOND: 4 }
    - { NETHERITE_SCRAP: 2, ECHO_SHARD: 2 }
    - { NETHERITE_INGOT: 1, NETHER_STAR: 1 }

autosave-seconds: 30

