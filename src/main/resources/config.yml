  ruzgar-kilici:
    ability: dash
    result: IRON_SWORD
    name: "<gradient:#9BE7FF:#3A8DFF>Rüzgâr Kılıcı</gradient>"
    description: "<gray>Sahibini rüzgârla ileri savurur."
    ingredients:
      FEATHER: 3
      IRON_INGOT: 2
      STICK: 1
  firtina-tozlugu:
