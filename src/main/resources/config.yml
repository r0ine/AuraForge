# AuraForge ayarları. Değişiklikler /auraforge reload ile uygulanır
# (forge.core-recipe hariç, o yeniden başlatma ister).

forge:
  # Tezgahı kurmak için kullanılan eşya
  core-item: NETHER_STAR
  # Forge Çekirdeği çalışma masasında üretilebilsin mi
  core-recipe: true
  # Tezgahın görünen bloğu
  block: SMITHING_TABLE
  # Tezgaha aynı anda konabilecek malzeme sayısı (en fazla 7)
  max-items: 6
  # Oyuncu başına tezgah sınırı, 0 = sınırsız. auraforge.admin sınıra takılmaz.
  max-per-player: 3
  hologram-height: 2.1
  # Süzülen eşyaların kaç tickte bir güncelleneceği
  animation-interval: 2
  # Bu yarıçapta oyuncu yoksa animasyon durur
  view-distance: 32.0

crafting:
  rounds: 3
  # İmlecin barı baştan sona geçme süresi; her turda speed-up ile çarpılır
  sweep-ms: 1600
  speed-up: 0.8
  # Yeşil bölgenin ve altın bölgenin bar üzerindeki genişliği (0-1 arası)
  zone-width: 0.2
  perfect-width: 0.06
  bar-length: 32
  pause-ticks: 14

quality:
  # Kalite 0 ve 100'deki yetenek gücü çarpanı
  power-min: 0.8
  power-max: 1.35
  # Kalite 100'de bekleme süresinden düşülen oran
  cooldown-reduction: 0.3

# cooldown saniye, duration tick cinsinden
abilities:
  dash:
    cooldown: 3.0
    power: 1.5
  leap:
    cooldown: 7.0
    power: 1.1
  shockwave:
    cooldown: 10.0
    radius: 4.5
    damage: 5.0
  guard:
    cooldown: 16.0
    duration: 100
    amplifier: 1

# Aynı yeteneği taşıyan zırh parçası sayısı min-pieces'e ulaşınca
# parça başına per-piece kadar güç eklenir.
set-bonus:
  min-pieces: 2
  per-piece: 0.06

autosave-seconds: 30

# Malzemeler tezgahtakilerle birebir eşleşmeli. Toplam adet max-items'ı geçemez.
